; /etc/supervisor/conf.d/fotos-workers.conf
; Filas: sync (delta queries, longas), media (EXIF, verificação, IA), default (notificações)

[program:fotos-sync-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fotos/backend/artisan queue:work redis --queue=sync --sleep=3 --tries=3 --timeout=3700 --max-time=14400
directory=/var/www/fotos/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3720
redirect_stderr=true
stdout_logfile=/var/www/fotos/backend/storage/logs/sync-worker.log

[program:fotos-media-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fotos/backend/artisan queue:work redis --queue=media --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/var/www/fotos/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=620
redirect_stderr=true
stdout_logfile=/var/www/fotos/backend/storage/logs/media-worker.log

[program:fotos-notification-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fotos/backend/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/fotos/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/fotos/backend/storage/logs/notification-worker.log
