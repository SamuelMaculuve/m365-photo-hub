# /etc/nginx/sites-available/fotos
# SPA (frontend/dist) e API Laravel na MESMA origem: cookies de sessão sem CORS.

server {
    listen 80;
    listen [::]:80;
    server_name fotos.organizacao.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fotos.organizacao.org;

    ssl_certificate     /etc/letsencrypt/live/fotos.organizacao.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotos.organizacao.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/fotos/frontend/dist;
    index index.html;
    client_max_body_size 20m;   # uploads vão directamente para a Microsoft; a API só recebe JSON

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uploads enviam blocos para *.sharepoint.com; vídeos e originais são servidos por redireccionamento.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.sharepoint.com https://*.svc.ms; media-src 'self' blob: https://*.sharepoint.com https://*.svc.ms; connect-src 'self' https://*.sharepoint.com https://*.svc.ms; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com" always;

    # API, autenticação Microsoft e CSRF do Sanctum → Laravel
    location ~ ^/(api|auth|sanctum|demo-media|up)(/|$) {
        root /var/www/fotos/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/fotos/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Recursos estáticos com hash no nome: cache longa
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do SPA
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\.(?!well-known) { deny all; }
}
